name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Discord
        run: xcodegen generate

      - name: Build IPA (unsigned)
        working-directory: Discord
        run: |
          set +e
          mkdir -p ../build
          xcodebuild \
            -project Discord.xcodeproj \
            -scheme Discord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath ../build/Discord.xcarchive \
            archive > ../build/xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # The job log needs repository admin rights to download, so the
            # compiler errors go to the check annotations and the step summary:
            # both are readable from the public run page.
            grep -aE "error:|fatal error:" ../build/xcodebuild.log > ../build/errors.txt
            head -40 ../build/errors.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            {
              echo "### xcodebuild failed with exit code $status"
              echo '```'
              head -80 ../build/errors.txt
              tail -120 ../build/xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -60 ../build/xcodebuild.log
          fi
          exit $status

      - name: Assemble Payload
        run: |
          mkdir -p build/Payload
          cp -R build/Discord.xcarchive/Products/Applications/evergarden.app build/Payload/

      # The engine's free container route needs the App Group entitlement, and
      # an ad-hoc signature is the only way to ship it inside an unsigned IPA.
      # SideStore / AltStore read it and request the group for the free profile.
      - name: Ad-hoc sign with entitlements
        run: |
          codesign --force --sign - \
            --entitlements Discord/Discord/Discord.entitlements \
            build/Payload/evergarden.app
          codesign -d --entitlements :- build/Payload/evergarden.app

      - name: Package IPA
        run: |
          cd build
          zip -r evergarden.ipa Payload
          rm -rf Payload

      # The artifact service occasionally answers with a transient DNS error
      # (`getaddrinfo ENOTFOUND ...blob.core.windows.net`) after the IPA was
      # built successfully. Allow that step to fail and retry once so the run
      # stays green and the artifact is still published.
      - name: Upload IPA artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: evergarden-unsigned
          path: build/evergarden.ipa
          retention-days: 30

      - name: Retry IPA artifact upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: evergarden-unsigned
          path: build/evergarden.ipa
          retention-days: 30
