name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Discord
        run: xcodegen generate

      - name: Build IPA (unsigned)
        working-directory: Discord
        run: |
          xcodebuild \
            -project Discord.xcodeproj \
            -scheme Discord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath ../build/Discord.xcarchive \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Discord.xcarchive/Products/Applications/Discord.app build/Payload/
          cd build
          zip -r Discord.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discord-unsigned
          path: build/Discord.ipa
          retention-days: 30
