name: Discord
options:
  bundleIdPrefix: com.zada
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES

targets:
  Discord:
    type: application
    platform: iOS
    sources:
      - path: Discord
        excludes:
          - "Info.plist"
          - "Patches"
      # Authored .3105 packages; copied flat into the bundle so
      # Bundle.main.url(forResource:withExtension:) finds them.
      - path: Discord/Patches
        buildPhase: resources
      # Animated banners from the dope 7.0 injector, shown on the Functions
      # and Info screens.
      - path: Discord/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Discord/Info.plist
        PRODUCT_NAME: evergarden
        # Free route: a normal id signable by a personal Apple ID. The App Group
        # route does not need the MobileHouseArrest identity; set this back to
        # com.apple.mobile.MobileHouseArrest only for the paid/enterprise build.
        PRODUCT_BUNDLE_IDENTIFIER: com.zada.discord
        SWIFT_OBJC_BRIDGING_HEADER: Discord/Discord-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Discord/Discord.entitlements
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Discord"
          - "$(SRCROOT)/Discord/engine"
          - "$(SRCROOT)/Discord/engine/include"
          - "$(SRCROOT)/Discord/exploit"
          - "$(SRCROOT)/Discord/kexploit"
        OTHER_LDFLAGS:
          - "-lz"
          - "-lc++"
          - "-lresolv"
          - "-ObjC"
    dependencies:
      - framework: Vendor/AirliftFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: CoreFoundation.framework
      - sdk: AVFoundation.framework
